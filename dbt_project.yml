# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_summit_26_stakeholders_self_service'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'merlin-co'

# dbt platform project metadata — enables Catalog (beta) platform enrichment
# and dbt CLI / Mesh project resolution in the dbt VS Code Extension.
#
# Left commented out because this repo is run from many different accounts (the workshop
# environment, attendees' own Snowflake, CI). Uncomment and fill in for a real project.
# dbt-cloud:
#   project-id: "123456"
#   account-host: "ab123.us1.dbt.com"

# Without the dbt-cloud block above, every invocation emits
# `InvalidConfig (dbt1005): Skipping semantic manifest validation`. The semantic models and
# metrics in this project are real and are validated in the platform; only the *local* check
# is skipped. To silence it locally, export
# DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION=1 — the CI workflow does this, so a real
# warning in CI is never buried under an expected one.


# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

# Layer defaults do the structural work so individual models don't repeat themselves.
#
# `access` and `group` are set per layer rather than per model, which makes the line between
# data product and implementation detail a property of *where a model lives* rather than of
# whether someone remembered. Marts opt into `access: public` individually — promotion is
# deliberate, and the default stays `protected`.
#
# `docs: show: false` on staging and intermediate is how "staging and intermediate shouldn't be
# discoverable as products at all" stops being a policy statement and starts being enforced.
models:
  dbt_summit_26_stakeholders_self_service:
    staging:
      +materialized: view
      +group: merlinco_platform
      +access: protected
      +docs:
        show: false
      +tags: ['layer:staging']
    intermediate:
      +materialized: view
      +group: merlinco_platform
      +access: protected
      +docs:
        show: false
      +tags: ['layer:intermediate']
    marts:
      +materialized: table
      +access: protected
      +tags: ['layer:marts']
