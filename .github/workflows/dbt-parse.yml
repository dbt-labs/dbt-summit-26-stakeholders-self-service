name: dbt parse

# This project's entire subject is YAML metadata, and the labs spend their time warning
# attendees about dbt1060 (config keys at the wrong nesting level), dbt1005 (duplicate
# definitions) and dbt1155 (a second source table entry silently discarded). All three are
# parse-time errors, and `dbt parse` needs no warehouse credentials — so catching them in CI is
# free.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, solutions, production-after]
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # actions/checkout@v6

      - name: Install dbt Fusion
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh \
            | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write a parse-only profile
        # No warehouse is reached: `dbt parse` resolves refs, sources, configs and YAML shape
        # without connecting. The credentials are placeholders and are never used.
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'PROFILE'
          merlin-co:
            target: ci
            outputs:
              ci:
                type: snowflake
                threads: 4
                account: "parse-only"
                user: "parse-only"
                password: "parse-only"
                database: "DBT_LEARN"
                warehouse: "PARSE"
                role: "PARSE"
                schema: dbt_ci_parse_only
          PROFILE

      - name: dbt parse
        # A clean parse is the bar. Attendees read these files as the reference, so a warning
        # here is a teaching defect, not noise to scroll past.
        #
        # Exactly one warning is allowed through: "Skipping semantic manifest validation",
        # which fires because the dbt-cloud block in dbt_project.yml is intentionally
        # commented out. It is allow-listed by message rather than suppressed with
        # DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION, because suppressing it once already
        # hid three real semantic-model errors that only a platform build caught. Left visible,
        # it is a standing reminder that green CI here does NOT mean the semantic models parse.
        run: |
          set -o pipefail
          dbt parse --target ci 2>&1 | tee parse.log
          if grep -E '^\[(warning|error)\]' parse.log \
              | grep -v 'Skipping semantic manifest validation' \
              | grep -q .; then
            echo "::error::dbt parse emitted unexpected warnings or errors — see the log above"
            exit 1
          fi

      - name: Remind that semantic models are unvalidated here
        run: |
          echo "::notice::dbt parse does not validate the semantic manifest without platform \
          config. Semantic model and metric changes must be confirmed by a platform build — \
          see docs/EXPECTED_FAILURES.md."
