version: 2

# REFERENCE IMPLEMENTATION — freshness on every source table, in three tiers.
#
# There is no load timestamp anywhere in RAW. Every timestamp in this dataset is a *business
# event* time, stored as text. Business time and load time answer different questions, so this
# file uses whichever check the table can actually support and says so on each one:
#
#   Tier A  loaded_at_field with a cast — tables with a real, dense event clock. Measures how
#           recent the newest *event* is. Does not prove the table finished loading.
#   Tier B  loaded_at_query — child tables with no clock of their own, borrowing the parent's.
#   Tier C  freshness with no loaded_at_field — dbt falls back to warehouse table metadata
#           (Snowflake's last_altered). The only honest option for slowly-changing reference
#           data, where an event date says nothing about staleness: a shop that opened in 2019
#           does not mean this table is stale. Proves the loader ran; proves nothing about
#           completeness.
#
# The workshop dataset is static, so every Tier A and Tier B check trips error_after
# immediately. That is correct behaviour on an honest threshold, not a broken config — see
# docs/DATA_LIMITATIONS.md. Thresholds describe the pipeline you want, not the one you have.
#
# Both `freshness` and `loaded_at_field` must be nested under `config:` — at the table level
# they're rejected with dbt1060.

sources:
  - name: merlinco_apothecaries
    description: >
      Raw Merlin & Co. Apothecaries operational tables. Fictional, deterministically generated
      training data shared across several dbt Summit 2026 labs; generated by
      dbt-labs/merlinco-apothecaries (dataset as of commit 5a97bc7, 2026-07-15). The workshop
      account loads it to RAW, matching the generator's own default target. If a column
      value asserted in a lab or the question bank stops matching, check the dataset version first.
    database: RAW
    schema: MERLINCO_APOTHECARIES
    config:
      meta:
        owner:
          name: Analytics Engineering
        support_channel: '#analytics-engineering-support'
        response_sla: '1 business day for load failures'
      tags: ['source:merlinco_apothecaries']
    tables:
      - name: RAW_CUSTOMERS
        identifier: RAW_CUSTOMERS
        # Tier A, but a weak one. Signups are sparse enough that a genuinely quiet week is
        # indistinguishable from a broken loader, hence the wide thresholds. If this table ever
        # gets a real load timestamp, switch to it — this is a proxy, not a measurement.
        config:
          loaded_at_field: try_to_timestamp_ntz(SIGNED_UP_AT)
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
        description: Raw customer records.
        columns:
          - name: CUSTOMER_ID
            description: Primary customer identifier.
            data_tests:
              - not_null
              - unique
          - name: FULL_NAME
            description: Customer display name.
          - name: EMAIL
            description: Customer email address.
          - name: HOME_REGION
            description: Raw customer home region code or name.
          - name: SIGNED_UP_AT
            description: Customer signup timestamp as text.
          - name: BIRTH_YEAR
            description: Customer birth year as text.
          - name: FAVORED_DISCIPLINE
            description: Customer favored magical discipline.
      - name: RAW_SHOPS
        identifier: RAW_SHOPS
        # Tier C. Slowly-changing reference data. OPENED_AT is an event date, not a load date —
        # a shop that opened years ago says nothing about whether this table loaded today — so
        # freshness here uses warehouse table metadata instead of a column.
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw shop locations.
        columns:
          - name: SHOP_ID
            description: Primary shop identifier.
            data_tests:
              - not_null
              - unique
          - name: SHOP_NAME
            description: Shop name.
          - name: CITY
            description: Shop city.
          - name: REGION
            description: Shop region.
          - name: OPENED_AT
            description: Shop opening date as text.
      - name: RAW_SUPPLIERS
        identifier: RAW_SUPPLIERS
        # Tier C. Contract dates are event dates, not load dates. Warehouse metadata instead.
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw supplier records.
        columns:
          - name: SUPPLIER_ID
            description: Primary supplier identifier.
            data_tests:
              - not_null
              - unique
          - name: SUPPLIER_NAME
            description: Supplier name.
          - name: REGION
            description: Supplier region.
          - name: RELIABILITY_RATING
            description: Supplier reliability rating as text.
          - name: CONTRACTED_SINCE
            description: Contract start date as text.
      - name: RAW_INGREDIENTS
        identifier: RAW_INGREDIENTS
        # Tier C. No timestamp column of any kind. Warehouse metadata is the only option here.
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw ingredient catalog.
        columns:
          - name: INGREDIENT_ID
            description: Primary ingredient identifier.
            data_tests:
              - not_null
              - unique
          - name: INGREDIENT_NAME
            description: Ingredient name.
          - name: SUPPLIER_ID
            description: Supplier identifier.
          - name: UNIT
            description: Raw ingredient unit.
          - name: UNIT_COST_COPPER
            description: Unit cost in copper coins as text.
          - name: IS_HAZARDOUS
            description: Messy boolean hazardous flag.
          - name: HARVEST_SEASON
            description: Harvest season.
      - name: RAW_POTIONS
        identifier: RAW_POTIONS
        # Tier C. INTRODUCED_AT only moves when a new potion is launched, which can be months
        # apart, so it is useless as a staleness signal. Warehouse metadata instead.
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw potion catalog.
        columns:
          - name: POTION_SKU
            description: Primary potion SKU.
            data_tests:
              - not_null
              - unique
          - name: POTION_NAME
            description: Potion name.
          - name: CATEGORY
            description: Raw potion category.
          - name: BASE_PRICE_COPPER
            description: Base price in copper coins as text.
          - name: POTENCY
            description: Potion potency as text.
          - name: SHELF_LIFE_DAYS
            description: Shelf life in days as text.
          - name: IS_REGULATED
            description: Messy boolean regulated flag.
          - name: INTRODUCED_AT
            description: Introduction date as text.
      - name: RAW_POTION_INGREDIENTS
        identifier: RAW_POTION_INGREDIENTS
        # Tier B. Recipe lines have no timestamp; they change when the potion catalog changes,
        # so they borrow the catalog's clock.
        config:
          loaded_at_query: "select max(try_to_date(INTRODUCED_AT)) from RAW.MERLINCO_APOTHECARIES.RAW_POTIONS"
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw potion recipe bridge.
        columns:
          - name: POTION_SKU
            description: Potion SKU.
            data_tests:
              - not_null
          - name: INGREDIENT_ID
            description: Ingredient identifier.
            data_tests:
              - not_null
          - name: QUANTITY
            description: Ingredient quantity as text.
          - name: UNIT
            description: Recipe unit.
      - name: RAW_ORDERS
        identifier: RAW_ORDERS
        # Tier A. Orders land continuously, so the newest ORDERED_AT is a fair proxy for how
        # current this table is. Caveat worth knowing: this reads max() across the whole table,
        # so in-store and courier-owl orders — which land immediately — keep it green even
        # while marketplace data sits two days behind. Freshness proves the table is loading.
        # It does not prove the day is complete. That gap is why question bank Q3 is a
        # documentation problem and not a monitoring one.
        config:
          loaded_at_field: try_to_timestamp_ntz(ORDERED_AT)
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        description: Raw order headers.
        columns:
          - name: ORDER_ID
            description: Primary order identifier.
            data_tests:
              - not_null
              - unique
          - name: CUSTOMER_ID
            description: Customer identifier.
          - name: SHOP_ID
            description: Shop identifier.
          - name: ORDERED_AT
            description: Order timestamp as text.
          - name: STATUS
            description: Raw order status.
          - name: CHANNEL
            description: Order channel.
          - name: DISCOUNT_COPPER
            description: Order discount in copper coins as text.
      - name: RAW_ORDER_ITEMS
        identifier: RAW_ORDER_ITEMS
        # Tier B. Order lines carry no timestamp of their own but land in the same load as
        # their order headers, so this borrows the parent's clock. If lines ever start arriving
        # separately from headers, this check goes silently wrong — which is the trade-off you
        # accept for measuring a table that cannot measure itself.
        config:
          loaded_at_query: "select max(try_to_timestamp_ntz(ORDERED_AT)) from RAW.MERLINCO_APOTHECARIES.RAW_ORDERS"
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        description: Raw order line items.
        columns:
          - name: ORDER_ITEM_ID
            description: Primary order item identifier.
            data_tests:
              - not_null
              - unique
          - name: ORDER_ID
            description: Order identifier.
          - name: POTION_SKU
            description: Potion SKU.
          - name: QUANTITY
            description: Ordered quantity as text.
          - name: UNIT_PRICE_COPPER
            description: Unit price in copper coins as text.
      - name: RAW_PAYMENTS
        identifier: RAW_PAYMENTS
        # Tier A. Payment attempts follow orders closely, so the same thresholds apply.
        config:
          loaded_at_field: try_to_timestamp_ntz(PAID_AT)
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        description: Raw payment attempts.
        columns:
          - name: PAYMENT_ID
            description: Primary payment identifier.
            data_tests:
              - not_null
              - unique
          - name: ORDER_ID
            description: Order identifier.
          - name: METHOD
            description: Payment method.
          - name: AMOUNT_COPPER
            description: Payment amount in copper coins as text.
          - name: STATUS
            description: Payment status.
          - name: PAID_AT
            description: Payment timestamp as text.
      - name: RAW_GUILDS
        identifier: RAW_GUILDS
        # Tier C. FOUNDED_YEAR is a year, and a historical one at that. Warehouse metadata.
        config:
          freshness:
            warn_after: {count: 30, period: day}
            error_after: {count: 90, period: day}
        description: Raw guild dimension.
        columns:
          - name: GUILD_ID
            description: Primary guild identifier.
            data_tests:
              - not_null
              - unique
          - name: GUILD_NAME
            description: Guild name.
          - name: FOUNDED_YEAR
            description: Guild founded year as text.
      - name: RAW_GUILD_MEMBERSHIPS
        identifier: RAW_GUILD_MEMBERSHIPS
        # Tier C. VALID_FROM is when a membership started, not when the row arrived, and
        # backdated memberships are normal — so an event-time check here would be actively
        # misleading. Warehouse metadata instead.
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        description: Raw customer guild membership intervals.
        columns:
          - name: MEMBERSHIP_ID
            description: Primary membership identifier.
            data_tests:
              - not_null
              - unique
          - name: CUSTOMER_ID
            description: Customer identifier.
          - name: GUILD_ID
            description: Guild identifier.
          - name: TIER
            description: Raw membership tier.
          - name: VALID_FROM
            description: Membership start date as text.
          - name: VALID_TO
            description: Membership end date as text.
      - name: RAW_BREW_EVENTS
        identifier: RAW_BREW_EVENTS
        # Tier A. Shops brew daily but not every shop every day, so the error threshold is
        # looser than orders — a quiet weekend across all fifteen shops is plausible.
        config:
          loaded_at_field: try_to_timestamp_ntz(BREWED_AT)
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
        description: Raw potion production events.
        columns:
          - name: BREW_ID
            description: Primary brew event identifier.
            data_tests:
              - not_null
              - unique
          - name: POTION_SKU
            description: Potion SKU brewed.
          - name: SHOP_ID
            description: Shop identifier.
          - name: CAULDRON_ID
            description: Cauldron identifier.
          - name: BREWED_AT
            description: Brew timestamp as text.
          - name: BATCH_SIZE
            description: Produced quantity as text.
          - name: BREW_DURATION_MINUTES
            description: Brew duration in minutes as text.
          - name: QUALITY_CHECK
            description: Raw quality check result.
          - name: BREWER_NAME
            description: Brewer name.
