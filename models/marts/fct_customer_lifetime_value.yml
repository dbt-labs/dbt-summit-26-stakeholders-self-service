version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      includes customers who never ordered — filter on has_ordered before
      summing or averaging revenue, or you'll understate the average across
      real buyers.
    config:
      meta:
        owner: commerce_analytics
        grain: customer
        intended_use: get the lifetime value and order value of customers, as well as days_to_first_order, days_since_last_order, has_ordered, is_repeat_customer
        caveats: also includes non-buying customers, so filter on has_ordered before
      group: commerce_analytics
      
    columns:

      - name: customer_id
        description: The unique id of the customer
        data_tests:
          - unique
          - not_null
      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: "The first date this customer placed an order"              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: "The total net lifetime value. This is considered the lifetime value."
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
