version: 2

models:
  - name: fct_customer_lifetime_value
    description: >
      Customer lifetime value, grain is one row per customer. 
      This table includes customers who never ordered — filter on has_ordered before
      summing or averaging revenue, or you'll understate the average across
      real buyers.
    
    config: 
      meta:
        grain: one row per customer
        intended_use: cohort analysis
        caveats: includes customers who never ordered and limited to orders in the past 30 days
          
      
    columns:

      - name: customer_id
        description: "Unique ID of the customer"
        data_tests:
          - unique
          - not_null
      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: "Date of customer's first order"              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: "Lifetime net revenue for the customer in US dollars"
        data_tests:
          - not_null
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
