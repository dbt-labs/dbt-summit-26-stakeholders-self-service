version: 2

models:
  - name: fct_customer_lifetime_value
    description: |
      This model is a customer-level fact table containing cumulative metrics, 
      order counts, and financial aggregations across a customer's entire lifecycle. 
      It is designed to be used for customer segmentation, lifetime value (LTV) reporting, churn analysis, 
      and cohort-based marketing analytics. The table is structured at a grain of one row per unique customer (customer_id). 
      Please note that this model includes customers who have never placed an order, so you must always filter on has_ordered = true before summing or averaging revenue 
      or order values to prevent understating metrics across real buyers.

    meta:
      grain: "one row per customer_id"
      intended_use: "Customer segmentation, lifetime value (LTV) reporting, and cohort analytics."
      caveats: "Includes customers who never ordered. Always filter on has_ordered = true before summing or averaging revenue to prevent understating metrics across real buyers."
      
    columns:
      - name: customer_id
        description: "Primary key. Unique identifier for the customer."
        tests:
          - not_null
          - unique
      - name: signed_up_date
        description: "Timestamp when the customer account was created."
      - name: home_region
        description: "Geographic region associated with the customer."
      - name: favored_discipline
        description: "Primary category or discipline preferred by the customer."
      - name: first_order_date
        description: "Timestamp of the customer's very first order."
      - name: last_order_date
        description: "Timestamp of the customer's most recent order."
      - name: order_count
        description: "Total number of orders placed."
      - name: billable_order_count
        description: "Total number of billable orders."
      - name: completed_order_count
        description: "Total number of successfully completed orders."
      - name: shop_count
        description: "Number of unique shops/merchants the customer has ordered from."
      - name: lifetime_order_item_count
        tests:
          - not_null
        description: "Total items purchased across all orders."
      - name: lifetime_gross_revenue
        tests:
          - not_null
        description: "Total gross revenue generated by the customer."
      - name: lifetime_discount
        tests:
          - not_null
        description: "Total discounts applied to the customer's orders."
      - name: lifetime_net_revenue
        tests:
          - not_null
        description: "Total net revenue (gross minus discounts)."
      - name: returned_revenue
        description: "Total revenue value of returned items."
      - name: lifetime_collected
        tests:
          - not_null
        description: "Total cash collected from the customer."
      - name: lifetime_refunded
        tests:
          - not_null
        description: "Total cash refunded to the customer."
      - name: lifetime_net_collected
        tests:
          - not_null
        description: "Total net cash collected (collected minus refunded)."
      - name: average_order_value
        description: "Average revenue per order."
      - name: days_to_first_order
        description: "Number of days between sign-up and the first completed order."
      - name: days_since_last_order
        description: "Number of days elapsed since the customer's last order."
      - name: has_ordered
        description: "Boolean flag indicating whether the customer has placed at least one order."
      - name: is_repeat_customer
        description: "Boolean flag indicating whether the customer has placed more than one order."