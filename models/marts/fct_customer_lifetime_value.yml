version: 2

models:
  - name: fct_customer_lifetime_value
    description: |
      The comprehensive history of each customer's lifetime value and ordering patterns. 
      It includes every registered customer, including those who have never placed an order.
      
      ### When to use this:
      Use this to analyze customer lifetime value, total spend, and purchase frequency over time. 
      Do not use this for active guild membership status, as there is no direct guild indicator in this model.
      
      ### Row Grain:
      One row per registered customer. Since it includes customers who have never ordered, some fields will be 0 or null.
      
      ### Caveats / Things to watch out for:
      - This includes customers who never ordered. If you sum or average revenue, filter on `has_ordered = true` (or check `has_ordered` first) before calculating, or you will understate the average across actual buyers.
      - `average_order_value` is calculated at the customer level; taking `avg()` over this column will average the average values of customers (an unweighted average of averages), which is mathematically incorrect for calculating the overall average order value. For overall average order value, use the `average_order_value` metric on the orders model.

    config:
      access: public
      group: commerce_analytics
      meta:
        maturity: production
        owner:
          name: Commerce Analytics
        support_channel: '#commerce-analytics-support'
        response_sla: '2 business hours for trust incidents'

    columns:
      - name: customer_id
        description: "Unique primary identifier for each registered customer."
        config:
          meta:
            grain: "One customer record per row."
            intended_use: "Counting unique registered customers or joining with other customer-specific tables."
            caveats: "Guaranteed to be unique and not null. Note that counting rows in this model gives the total number of registered customers, which includes those who have never placed an order."
        data_tests:
          - not_null
          - unique

      - name: signed_up_date
        description: "The date the customer signed up or registered in our system."

      - name: home_region
        description: "Canonical home region of the customer (e.g., Northern Reaches, Ember Coast, Silverwood, The Marshlands, Crystal Vale)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Northern Reaches', 'Ember Coast', 'Silverwood', 'The Marshlands', 'Crystal Vale']

      - name: favored_discipline
        description: "Customer's favored magical discipline (e.g., Alchemy, Brewing, Conjuring, etc.)."

      - name: first_order_date
        description: "The date of the customer's first order. This is null if the customer has never ordered."

      - name: last_order_date
        description: "The date of the customer's last order. This is null if the customer has never ordered."

      - name: order_count
        description: "Total count of all orders placed by the customer, including cancelled ones."

      - name: billable_order_count
        description: "The count of non-cancelled orders (orders with status distinct from 'cancelled')."

      - name: completed_order_count
        description: "The count of completed orders (orders with status 'completed')."

      - name: shop_count
        description: "How many different shops this customer has ever ordered from."
        config:
          meta:
            grain: "Whole customer history, not per year — a loyal customer who moved shops once still counts 2."
            intended_use: "Spotting customers who spread their buying across shops. Not a measure of shop performance — sum it and you double-count nothing meaningful."
            caveats: "A customer who has never ordered shows 0, not null, so an average over this column is dragged down by people who never bought anything."

      - name: lifetime_order_item_count
        description: "The sum of order item counts across all non-cancelled orders."

      - name: lifetime_gross_revenue
        description: "The total gross revenue generated by the customer across all non-cancelled orders, measured in gold standard."

      - name: lifetime_discount
        description: "The total discount applied to the customer across all non-cancelled orders, measured in gold standard."

      - name: lifetime_net_revenue
        description: "The total net revenue (gross revenue minus discounts) generated by the customer across all non-cancelled orders, measured in gold standard."

      - name: returned_revenue
        description: "The total net revenue from orders that were returned by the customer, measured in gold standard."

      - name: lifetime_collected
        description: "The total cash or gold actually collected from successful payments for this customer."

      - name: lifetime_refunded
        description: "The total cash or gold refunded to this customer from their payments."

      - name: lifetime_net_collected
        description: "The net amount of gold collected (total collected minus total refunded) for this customer."

      - name: average_order_value
        description: "The customer's average order spend, calculated as lifetime net revenue divided by billable order count."
        config:
          meta:
            grain: "Whole customer history, not per year."
            intended_use: "Analyzing average value per order for individual buying customers. Useful for segmenting customers based on order value."
            caveats: "Taking an unweighted `avg()` over this column will result in an average of averages, which is mathematically incorrect for calculating the overall average order value. Also, this column is NULL for customers who have never ordered. For overall average order value, use the `average_order_value` metric on the orders model."

      - name: days_to_first_order
        description: "The number of days between customer signup date and first order date."

      - name: days_since_last_order
        description: "The number of days between the customer's last order date and today."

      - name: has_ordered
        description: "A boolean flag indicating if the customer has placed at least one non-cancelled order."

      - name: is_repeat_customer
        description: "A boolean flag indicating if the customer has placed more than one non-cancelled order."
