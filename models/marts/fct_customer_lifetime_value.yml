version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      includes customers who never ordered — filter on has_ordered before
      summing or averaging revenue, or you'll understate the average across
      real buyers.
      
    columns:

      - name: customer_id
        description: "Unique organization generated identifier for customer"
        data_tests:
          - not_null
      - name: signed_up_date
        description: "Date the customer signed first completed purchase order.  Not the date customer received or paid first order.  Incomplete or cancelled orders do not count."
        data_tests:
          - not_null
      - name: home_region
        description: "Geographic region of customer account on file according to internal sales region."
      - name: favored_discipline
        description: "Type of martial arts the customer prefers (kung fu, karate, MMA)."

      - name: first_order_date
        description: "Date of first completed order EST."              
      - name: last_order_date
        description: "Date of most recent completed order for customer."
      - name: order_count
        description: "Count of total uncancelled orders completed by customer since signed up date."
      - name: billable_order_count
        description: "Count of billable orders since signed up date."
      - name: completed_order_count
        description: "Count of completed orders for customer since sign up date."
      - name: shop_count
        description: "Total number of chops on file for the customer, defined by unique addresses."
      - name: lifetime_order_item_count
        description: "Total number of items ordered in uncancelled orders since sign up date."
      - name: lifetime_gross_revenue
        description: "Total revenue captured (paid without refund)."
      - name: lifetime_discount
        description: "Lifetime discount."
      - name: lifetime_net_revenue
        description: "Lifetime net revenue"
      - name: returned_revenue
        description: "returned revenue"
      - name: lifetime_collected
        description: "lifetime collected"
      - name: lifetime_refunded
        description: "lifetime refunded."
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
