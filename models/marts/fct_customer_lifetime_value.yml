version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      Customer lifetime value mart at one row per customer, including signup attributes, order activity, 
      lifetime revenue and collection metrics, and repeat-customer indicators. Includes customers who
      have never ordered; filter on has_ordered when calculating buyer-level revenue averages
    config:
      meta:
        grain: "One row per customer."
        intended_use:
          - "Analyze realized customer lifetime revenue and collections."
          - "Compare signup cohorts, regions, favored disciplines, and repeat-customer behavior."
        caveats:
          - "Includes customers who have never ordered; filter on has_ordered for buyer-level revenue averages."
          - "Lifetime value fields are realized-to-date measures through the latest available order data, not predictive forecasts."


      
    columns:

      - name: customer_id
        description: "Internal customer identifier."
        data_tests:
          - not_null
          - unique

      - name: signed_up_date
        description: "Date when the customer signed up"
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: "Date when the customer place their first order"              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
