version: 2

models:
  - name: fct_customer_lifetime_value
    description: >-
      One row per customer, including customers with no billable orders. Combines
      customer signup and profile attributes with lifetime order, shop, item,
      revenue, collection, and refund measures, plus average order value and
      ordering behavior flags. Revenue measures exclude cancelled orders, and
      average order value is calculated across billable orders.

    config:
      meta:
        owner:
          name: Commerce Analytics
        grain: One row per customer.
        intended_use: >-
          Customer-level lifetime value analysis, buyer segmentation, retention
          analysis, and ordering behavior reporting.
        caveats: >-
          Includes customers with no billable orders; use has_ordered when analysis
          should include buyers only. Revenue measures exclude cancelled orders,
          average_order_value is null when a customer has no billable orders, and
          lifetime and recency measures reflect data available at the latest build
          rather than a historical point-in-time snapshot.

    columns:

      - name: customer_id
        description: Customer identifier; defines the model's one-row-per-customer grain.
        data_tests:
          - not_null
          - unique

      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: >-
          Date of the customer's earliest recorded order, including cancelled
          orders. Null when the customer has no recorded orders.

      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: >-
          Total net item revenue in gold after allocated discounts across all
          non-cancelled orders. Revenue from returned orders remains included and
          is also reported separately in returned_revenue. Zero when the customer
          has no non-cancelled orders.
        data_tests:
          - not_null

      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
