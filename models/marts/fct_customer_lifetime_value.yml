version: 2

models:
  - name: fct_customer_lifetime_value
    description: >
      Customer-level lifetime value mart with one row per customer, including
      customers who have never placed a billable order. Combines signup and
      segmentation attributes with all-time order activity, revenue, collections,
      refunds, purchase frequency, and recency measures as of the latest model
      refresh. Revenue measures exclude cancelled orders, while
      lifetime_net_collected represents successful collections less refunds.
      Use has_ordered for buyer-only analysis—especially averages—to prevent
      zero-value non-buyers from understating customer value.
    config:
      meta:
        grain: One row per customer
        intended_use: Assessing the overall customer activity
        caveats: >
          includes customers who never ordered — filter on has_ordered before
          summing or averaging revenue
    columns:
      - name: customer_id
        description: The unique identifier for a customer
        data_tests:
          - unique
          - not_null
      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: The first date the customer placed an order             
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: The total, aggregate net revenue across all orders
        data_tests:
          - not_null
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
