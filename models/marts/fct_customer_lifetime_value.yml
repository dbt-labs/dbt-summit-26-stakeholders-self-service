version: 2

models:
  - name: fct_customer_lifetime_value
    description: >-
      Customer-level mart for lifetime purchasing behavior and value analysis,
      with one row per customer. Includes customers who have never ordered, so
      filter on `has_ordered` before calculating buyer-level revenue averages.

    config:
      meta:
        grain: one row per customer
        intended_use: >-
          Customer segmentation, retention analysis, repeat-purchase analysis,
          and comparison of lifetime purchasing value across customer cohorts.
        caveats: >-
          Includes customers who have never ordered; filter on `has_ordered` for
          buyer-only analysis. Lifetime revenue excludes cancelled orders but
          includes returned orders, which are tracked separately in
          `returned_revenue`.
        owner: commerce_analytics

      access: protected
      contract: 
        enforced: true

    columns:

      - name: customer_id
        description: Primary identifier for the customer and the grain of this model.
        data_tests:
          - unique
          - not_null
      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: >-
          Date of the customer's earliest order, regardless of order status.
          Null when the customer has never placed an order.
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: >-
          Customer lifetime value in gold, calculated as gross order revenue
          less discounts across all non-cancelled orders. Zero for customers
          with no non-cancelled orders.
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
