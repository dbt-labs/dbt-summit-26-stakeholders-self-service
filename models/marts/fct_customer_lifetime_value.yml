version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      Customer lifetime value, one row per customer. Includes customers who never ordered,
      filter on has_ordered before summing or averaging revenue, or you'll understate the average across
      real buyers.
      
    columns:

      - name: customer_id
        description: "unique identifier joins to dim_customers"
        config:
          meta: {'grain': 'one row per customer',
                'intended_use': 'unique identifier and join to other dim tables like dim_customers',
                'caveats': 'includes customers who never ordered'}
      - name: signed_up_date
        description: "date customer signup up"
      - name: home_region
        description: "home region of customer (North America, Europe, etc.)"
      - name: favored_discipline
        description: "customer discipline (shopping, marketing, sales, etc.)"

      - name: first_order_date
        description: "first date customer submitted an order successfuly" 
        meta: {'grain': 'one row per customer',
                'intended_use': 'slice order dates',
                'caveats': 'will be NULL for customers who never ordered'}             
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
