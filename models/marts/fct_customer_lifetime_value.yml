version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      The order's current status (pending, paid, shipped, delivered, or cancelled), synced live from the source system.
      Reflects the current status only. It doesn't keep a history of past changes.

    config:
      meta:
        grain: one row per customer
        intended_use: "cohort and retention analysis"
        caveats: "excludes orders refunded under 30 days"
        

    columns:
      - name: customer_id
        description: "Unique customer ID"
      - name: signed_up_date
        description: "Date originally signed up to be a part of the system."
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: ""
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
