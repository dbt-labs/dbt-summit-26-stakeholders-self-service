version: 2

models:
  - name: fct_customer_lifetime_value
    description:
      All customers to date (grain = customer) and their aggregated order information
      that calculates lifetime value. This includes all-time data at the company.
      Includes customers who never ordered, which can be filtered with has_ordered = FALSE.
      The model contains metrics that are both roll-up summations of order variables as well as
      roll-up averages.
    
    config:
      meta:
        owner: 'BI Team'
        grain: 'customer'
      group: 'commerce_analytics'

    columns:

      - name: customer_id
        description: "Unique ID of the customer in our order system."
        data_tests:
          - unique
          - not_null
      - name: signed_up_date
        description: "The date the Customer signed up. Should never be NULL."
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""

      - name: first_order_date
        description: "The date of the Customer's first order. Will be NULL if has_ordered = FALSE."              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
        data_tests:
          - not_null
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
