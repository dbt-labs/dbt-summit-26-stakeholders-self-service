version: 2

models:
  - name: fct_customer_lifetime_value
    description: >
      Customer lifetime value mart at one row per customer. Includes customers
      who have never placed a billable order; use has_ordered when calculating
      metrics specifically for customers who have purchased.
    config:
      meta:
        granularity: One row per customer.
        intended_use: >
          Customer lifetime value analysis, customer segmentation, cohort
          analysis, and comparisons of purchasing behavior and revenue across
          customer groups.
        caveats:
          - >
            Customers who have never placed a billable order are included with
            zero lifetime revenue. Filter on has_ordered when calculating
            averages across purchasing customers.
          - >
            Revenue fields exclude cancelled orders, while first_order_date,
            last_order_date, order_count, shop_count, and
            lifetime_order_item_count include orders regardless of status.
          - >
            Lifetime values are cumulative through the model's latest build and
            should not be interpreted as point-in-time historical values.
          - >
            Monetary values are denominated in gold.
      
    columns:
      - name: customer_id
        description: " Primary identifier for the customer and the grain of this model."
        granularity: 
      - name: signed_up_date
        description: ""
      - name: home_region
        description: ""
      - name: favored_discipline
        description: ""
      - name: first_order_date
        description: "Date of the customer's first recorded order, regardless of order status.
          Null when the customer has never placed an order."              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
