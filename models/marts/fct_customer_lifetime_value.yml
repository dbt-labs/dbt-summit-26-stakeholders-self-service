version: 2

models:
  - name: fct_customer_lifetime_value
    description: >
      Model with customer information including sign up date, aggregated totals on orders. Summaries updated regularly.
      Sourced from intermediate model rollup model.
      
    columns:

      - name: customer_id
        description: customer id
        data_test:
          - not_null
          - unique
      - name: signed_up_date
        description: date the customer signed up
        data_tests:
          - not_null
      - name: home_region
        description: geographic region customer resides in 
      - name: favored_discipline
        description: ""
      - name: first_order_date
        description: The first date this customer ordered. Day not timestamp              
      - name: last_order_date
        description: ""
      - name: order_count
        description: ""
      - name: billable_order_count
        description: ""
      - name: completed_order_count
        description: ""
      - name: shop_count
        description: ""
      - name: lifetime_order_item_count
        description: ""
      - name: lifetime_gross_revenue
        description: ""
      - name: lifetime_discount
        description: ""
      - name: lifetime_net_revenue
        description: ""
      - name: returned_revenue
        description: ""
      - name: lifetime_collected
        description: ""
      - name: lifetime_refunded
        description: ""
      - name: lifetime_net_collected
        description: ""
      - name: average_order_value
        description: ""
      - name: days_to_first_order
        description: ""
      - name: days_since_last_order
        description: ""
      - name: has_ordered
        description: ""
      - name: is_repeat_customer
        description: ""
